# =============================================================================
# Unprivileged user-space NFS server for the test-infrastructure stack (T134, docs/16 DR-16-2, finding D-10)
# =============================================================================
# Rootless, unprivileged: no `privileged`, no added capability, no kernel NFS server, no kernel mount. The server is unfs3 (unfsd 0.11.0) with rpcbind, built by
# scripts/test-infra/nfs_build.sh into a local image; the clients are the libnfs user-space utilities of IMG-INFRA-CLIENT (nfs-ls, nfs-cp, nfs-cat), which run on the
# project's compose network, so no host port is published. Used together with docker-compose.test-infra.yml (same project, same labels, same network):
#   scripts/test-infra/up.sh --build-id <id> --services nfs        (adds this file and the variable TI_NFS_IMAGE to the project)
# The image is a local build referenced by its manifest digest (TI_NFS_IMAGE=localhost/catalogizer-infra-nfs@sha256:..., printed by nfs_build.sh as image_ref).
# This does NOT test the application's own NFS code path: that path mounts through the kernel (syscall.Mount, evidence wp12/nfs-codepath.md) and stays unconfirmed here.
# =============================================================================

# podman-compose 1.5.0 defaults `in_pod` to true (podman_compose.py:2081) and then creates an UNLABELLED pod `pod_<project>`; the stack runs without a pod (WF12 F2, WF17 TI-C2)
x-podman:
  in_pod: false

x-labels: &labels
  project: catalogizer
  op_id: "${TI_OP_ID:?TI_OP_ID is generated by scripts/test-infra/gen_env.sh}"
  catalogizer.op_id: "${TI_OP_ID:?TI_OP_ID is generated by scripts/test-infra/gen_env.sh}"
  catalogizer.test_project: "${TI_PROJECT:?TI_PROJECT is generated by scripts/test-infra/gen_env.sh}"
  catalogizer.test_root: "${TI_ROOT_HASH:?TI_ROOT_HASH is generated by scripts/test-infra/gen_env.sh}"

services:
  nfs:
    image: "${TI_NFS_IMAGE:-localhost/blocked-nfs-image-not-built:none}"   # up.sh sets TI_NFS_IMAGE from nfs_build.sh; the placeholder cannot resolve
    pull_policy: never
    labels: *labels
    tmpfs:
      - /export:rw,mode=0777
    networks: [test-network]
    mem_limit: 256m
    cpus: 0.25
