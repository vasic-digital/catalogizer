  # --- constitution hub engines (layout: hub = <root>/constitution/submodules/<name>/) ---
  # Convention copied from constitution/helix-deps.yaml: hub engines are depth-1
  # entries under the hub (11.4.28(C) carve-out); `recursive_init: false` marks
  # engines that MUST NOT be initialised with --recursive (use
  # scripts/safe_submodule_init.sh). At canon 5f8503b NEITHER llmctl nor
  # claude_toolkit nests an own-org repository any more; both nest third-party
  # repositories only (llmctl: llama.cpp + colibri; claude_toolkit: the Go
  # toolchain under submodules/go), which are never initialised recursively,
  # and llmctl is additionally a depth-1 hub entry by contract (11.4.277(B)).
  - name: llmctl
    ssh_url: git@github.com:vasic-digital/llmctl.git
    ref: f42bad6              # pinned sha = gitlink of constitution/submodules/llmctl at constitution's recorded pin
    why: "11.4.277 llmctl model validation gate and host-safe model units; the vendored model manager (validate / require-validated) for HelixQA Vision (11.4.278)"
    layout: hub
    recursive_init: false    # NEVER --recursive (11.4.277(B) depth-1 hub entry); f42bad6 nests only third-party llama.cpp + colibri; CM-LLMCTL-SUBMODULE-NONRECURSIVE PASSes

  - name: claude_toolkit
    ssh_url: git@github.com:vasic-digital/claude_toolkit.git
    ref: 1f6dad3              # pinned sha = gitlink of constitution/submodules/claude_toolkit at constitution's recorded pin (5f8503b)
    why: "constitution hub engine: multi-alias / provider toolkit (11.4.196 / 11.4.198 native-first orchestration); never shipped in a product artifact. At 1f6dad3 it nests no own-org repository, resolves its own-org deps flat via scripts/resolve_deps.sh and ships its own helix-deps.yaml"
    layout: hub
    recursive_init: false    # NEVER --recursive: 1f6dad3 nests only the third-party Go toolchain (submodules/go, go.googlesource.com); CM-HUB-ENGINE-NO-OWNORG-NESTING and CM-HELIX-DEPS-MANIFEST-PRESENT PASS

