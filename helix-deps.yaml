# helix-deps.yaml - Catalogizer root project Submodule-Dependency Manifest
# Per HelixConstitution 11.4.31 (Submodule-Dependency-Manifest Mandate).
#
# This is the ROOT project manifest. It declares every own-org
# (vasic-digital/*, HelixDevelopment/*) dependency the root project uses:
#   1. the flat own-org submodules recorded in .gitmodules (layout: grouped,
#      i.e. <root>/submodules/<name>/), refs = the gitlinks STAGED in the root
#      index (`git ls-files -s`), re-synced on 2026-10-22 after the own-org
#      submodule bumps of this change (short shas, no upstream tags relied on);
#      enforced by constitution/scripts/gates/cm_helix_deps_ref_matches_gitlink.sh;
#   2. the constitution hub engines the project binds (layout: hub, i.e.
#      <root>/constitution/submodules/<name>/, resolved through the
#      constitution hub per 11.4.28(C); they are NOT root-level submodules and
#      are NOT added to .gitmodules of the root). Their refs = the gitlinks
#      recorded inside constitution at its pinned commit 5f8503b
#      (`git -C constitution ls-tree 5f8503b submodules/`); the ref gate reports
#      them BLIND because they have no root .gitmodules entry (by design).
#
# NOT listed here (by design):
#   - the constitution submodule itself (HelixConstitution): it is the hub and
#     is inherited by reference (CLAUDE.md / @constitution/CLAUDE.md);
#   - third-party tool submodules (Genymobile/scrcpy, appium, skyvern, chroma,
#     ... and WangX0111/superspec): they are not own-org dependencies. Their
#     existence verdicts live in docs/dependency_existence_register.md
#     (11.4.270) and docs/dependency_existence_register.tsv.
#
# Validation: scripts/verify_helix_deps_manifests.sh (walks the root,
# submodules/* and constitution/submodules/*; own-org repos MUST ship a
# well-formed helix-deps.yaml; third-party repos are SKIP(third_party)).
# Companion guide: docs/scripts/verify_helix_deps_manifests.md
# All ssh_urls were verified reachable with `git ls-remote` on 2026-10-21.

