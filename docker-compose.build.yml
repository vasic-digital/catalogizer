# Containerized Build, Test & Release Pipeline for Catalogizer
# Usage: podman-compose -f docker-compose.build.yml up --build --abort-on-container-exit
# Or via: ./scripts/container-build.sh [version]
#
# T129 (docs/16 D-06): the postgres and redis services use digest-pinned images (IMG-INFRA-POSTGRES, IMG-INFRA-REDIS of build/containers/images.lock.yaml),
# every credential and host port is a ${TI_*} variable (no literal), and each service carries the project labels. The variables come from the per-run
# mode 0600 env file that scripts/test-infra/gen_env.sh writes (`--env-file <that file>`), which also picks random host ports so a developer machine's own
# PostgreSQL or Redis on 5432/6379 never collides. The builder service itself (host network, caches) is unchanged by T129.

services:
  # ============================================================
  # PostgreSQL 15 - Integration test database
  # ============================================================
  postgres:
    image: docker.io/library/postgres@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    pull_policy: never
    labels:
      project: catalogizer
      catalogizer.test_project: "${TI_PROJECT:?TI_PROJECT is generated by scripts/test-infra/gen_env.sh}"
    environment:
      POSTGRES_DB: "${TI_POSTGRES_DB:?}"
      POSTGRES_USER: "${TI_POSTGRES_USER:?}"
      POSTGRES_PASSWORD: "${TI_POSTGRES_PASSWORD:?}"
    healthcheck:
      test: ["CMD-SHELL", "psql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc 'SELECT 1' | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    ports:
      - "127.0.0.1:${TI_PORT_POSTGRES:?}:5432"
    tmpfs:
      - /var/lib/postgresql/data

  # ============================================================
  # Redis 7 - Integration test cache
  # ============================================================
  redis:
    image: docker.io/library/redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    pull_policy: never
    labels:
      project: catalogizer
      catalogizer.test_project: "${TI_PROJECT:?TI_PROJECT is generated by scripts/test-infra/gen_env.sh}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    ports:
      - "127.0.0.1:${TI_PORT_REDIS:?}:6379"
    tmpfs:
      - /data

  # ============================================================
  # Main builder container
  # Multi-toolchain: Go + Node + Rust + JDK + Android SDK
  # Uses host networking for reliable package downloads
  # ============================================================
  catalogizer-builder:
    image: localhost/catalogizer-builder:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.builder
      network: host
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Infrastructure (use localhost since builder uses host network)
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "${TI_PORT_POSTGRES:?}"
      POSTGRES_DB: "${TI_POSTGRES_DB:?}"
      POSTGRES_USER: "${TI_POSTGRES_USER:?}"
      POSTGRES_PASSWORD: "${TI_POSTGRES_PASSWORD:?}"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "${TI_PORT_REDIS:?}"
      # Build configuration
      BUILD_VERSION: "${BUILD_VERSION:-1.0.0}"
      BUILD_NUMBER: "${BUILD_NUMBER:-0}"
      BUILD_COMPONENTS_ENV: "${BUILD_COMPONENTS:-all}"
      FORCE_BUILD: "${FORCE_BUILD:-false}"
      SKIP_TESTS: "${SKIP_TESTS:-false}"
      SKIP_EMULATOR_TESTS: "${SKIP_EMULATOR_TESTS:-true}"
      SKIP_E2E_TESTS: "${SKIP_E2E_TESTS:-false}"
      SKIP_SECURITY_TESTS: "${SKIP_SECURITY_TESTS:-true}"
      # Database config for Go tests
      DB_TYPE: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "${TI_PORT_POSTGRES:?}"
      DB_NAME: "${TI_POSTGRES_DB:?}"
      DB_USER: "${TI_POSTGRES_USER:?}"
      DB_PASSWORD: "${TI_POSTGRES_PASSWORD:?}"
      # CI mode
      CI: "true"
      # Go toolchain - use local, don't try to download newer versions
      GOTOOLCHAIN: local
      # Android SDK
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
    deploy:
      resources:
        limits:
          cpus: '3'
          memory: 8G
    volumes:
      - .:/project
      - go-cache:/root/go
      - gradle-cache:/root/.gradle
      - npm-cache:/root/.npm
      - cargo-cache:/opt/cargo/registry

  # ============================================================
  # Android Emulator (optional, requires KVM on host)
  # Activate with: --profile emulator
  # ============================================================
  android-emulator:
    image: docker.io/budtmo/docker-android:emulator_14.0
    profiles:
      - emulator
    privileged: true
    environment:
      EMULATOR_DEVICE: "pixel_5"
      WEB_VNC: "true"
    ports:
      - "6080:6080"   # VNC web viewer
      - "5555:5555"   # ADB
    devices:
      - /dev/kvm

volumes:
  go-cache:
  gradle-cache:
  npm-cache:
  cargo-cache:
