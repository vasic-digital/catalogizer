# =============================================================================
# Read-only user-space NFSv3 server fixture for the pkg/nfs3 client (WP-12 PA-06)
# =============================================================================
# go-nfs v0.0.4 (willscott/go-nfs, Apache-2.0) exporting a deterministic in-memory corpus. FIXTURE ONLY, never a runtime dependency. Rootless,
# no added capability, read-only root filesystem, no kernel NFS server, no kernel mount, no published port. MOUNT and NFS share ONE port (2049) and
# there is no portmapper, so clients set MountPort = NFSPort = 2049. Used together with docker-compose.test-infra.yml (same project, labels, network):
#   TI_NFS3_IMAGE=$(sh submodules/filesystem/test/nfs3fixture/build_image.sh | sed 's/^image_ref=//')   # localhost/catalogizer-test-nfs3@sha256:<digest>
# The image is a local build referenced by its manifest digest, like docker-compose.test-infra.nfs.yml (T134). It does not replace that fixture: unfs3
# (T134) is a rpcbind-registered server for the libnfs oracle; this one is the independent-implementation server for the Go client.
# Evidence: specs/001-full-project-audit-remediation/evidence/wp12/nfs3/.
# =============================================================================

# podman-compose defaults `in_pod` to true and creates an UNLABELLED pod; the stack runs without a pod (same reason as docker-compose.test-infra.nfs.yml)
x-podman:
  in_pod: false

x-labels: &labels
  project: catalogizer
  op_id: "${TI_OP_ID:?TI_OP_ID is generated by scripts/test-infra/gen_env.sh}"
  catalogizer.op_id: "${TI_OP_ID:?TI_OP_ID is generated by scripts/test-infra/gen_env.sh}"
  catalogizer.test_project: "${TI_PROJECT:?TI_PROJECT is generated by scripts/test-infra/gen_env.sh}"
  catalogizer.test_root: "${TI_ROOT_HASH:?TI_ROOT_HASH is generated by scripts/test-infra/gen_env.sh}"

services:
  nfs3:
    image: "${TI_NFS3_IMAGE:-localhost/blocked-nfs3-image-not-built:none}"   # the placeholder cannot resolve
    pull_policy: never
    labels: *labels
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65534:65534"
    networks: [test-network]
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
