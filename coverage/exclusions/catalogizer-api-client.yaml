# coverage/exclusions/catalogizer-api-client.yaml - T200. The checked-in exclusion fence of catalogizer-api-client (docs/05 7.3, constitution 11.4.224 E): every entry is justified from the closed class set
# (generated-code | vendored-third-party | non-shipping-fixtures-and-golden-assets); a first-party entry needs a tracked item. Written from direct reads of the tree on 2026-10-06;
# the gate is scripts/coverage/check_exclusions.sh, its verdict on this file is recorded in specs/001-full-project-audit-remediation/evidence/coverage_baseline/catalogizer-api-client/exclusions-check.json.
schema: coverage-exclusions/1
application: catalogizer-api-client
exclusions:
  - path: "dist/**"
    class: generated-code
    justification: "the tracked TypeScript compiler output under catalogizer-api-client/dist (index.js, services, types, utils with their .d.ts and .map files): generated from src by the package build, not a source of ours"
  - path: "src/**/*.d.ts"
    class: generated-code
    justification: "jest.config.js collectCoverageFrom negates src/**/*.d.ts: type declaration files the TypeScript compiler emits; none is tracked under src today (the tracked .d.ts files are the dist output above), and the class check refuses a hand-written one that appears"
