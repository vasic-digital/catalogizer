# coverage/exclusions/catalogizer-desktop.yaml - T200. The checked-in exclusion fence of catalogizer-desktop (docs/05 7.3, constitution 11.4.224 E): every entry is justified from the closed class set
# (generated-code | vendored-third-party | non-shipping-fixtures-and-golden-assets); a first-party entry needs a tracked item. Written from direct reads of the tree on 2026-10-06;
# the gate is scripts/coverage/check_exclusions.sh, its verdict on this file is recorded in specs/001-full-project-audit-remediation/evidence/coverage_baseline/catalogizer-desktop/exclusions-check.json.
schema: coverage-exclusions/1
application: catalogizer-desktop
exclusions:
  - path: "src/test-utils/**"
    class: non-shipping-fixtures-and-golden-assets
    justification: "test render helpers, test data and component templates (componentTemplates.tsx, testData.ts, testHooks.tsx, testRender.tsx, setup.ts): imported by tests only, never shipped"
  - path: "src-tauri/gen/**"
    class: generated-code
    justification: "the JSON schemas written by the Tauri build step into src-tauri/gen/schemas (acl-manifests.json, capabilities.json, desktop-schema.json): generated, not Rust or TypeScript code"
  - path: "**/__tests__/**"
    class: non-shipping-fixtures-and-golden-assets
    justification: "test source directories named __tests__: test code run by the test runner, never shipped"
  - path: "**/*.test.*"
    class: non-shipping-fixtures-and-golden-assets
    justification: "test source files named *.test.*: test code run by the test runner, never shipped"
  - path: "**/*.spec.*"
    class: non-shipping-fixtures-and-golden-assets
    justification: "test source files named *.spec.*: test code run by the test runner, never shipped"
  - path: "node_modules/**"
    class: vendored-third-party
    justification: "npm-installed third-party packages, not tracked in this repository and owned by their upstream projects"
