# coverage/exclusions/catalogizer-androidtv.yaml - T200. The checked-in exclusion fence of catalogizer-androidtv (docs/05 7.3, constitution 11.4.224 E): every entry is justified from the closed class set
# (generated-code | vendored-third-party | non-shipping-fixtures-and-golden-assets); a first-party entry needs a tracked item. Written from direct reads of the tree on 2026-10-06;
# the gate is scripts/coverage/check_exclusions.sh, its verdict on this file is recorded in specs/001-full-project-audit-remediation/evidence/coverage_baseline/catalogizer-androidtv/exclusions-check.json.
schema: coverage-exclusions/1
application: catalogizer-androidtv
exclusions:
  - path: "**/R.class"
    class: generated-code
    justification: "the Android resource index class generated by the Android Gradle plugin from res/, regenerated on every build"
  - path: "**/R$*.class"
    class: generated-code
    justification: "the nested resource classes generated with R.class by the Android Gradle plugin"
  - path: "**/BuildConfig.*"
    class: generated-code
    justification: "BuildConfig generated by the Android Gradle plugin from the Gradle build types"
  - path: "**/Manifest*.*"
    class: generated-code
    justification: "the Manifest permission class generated by the Android Gradle plugin from the AndroidManifest declarations"
  - path: "**/com/catalogizer/androidtv/databinding/**"
    class: generated-code
    justification: "data-binding classes generated by the Android Gradle plugin; the project declares them and the directory is empty of hand-written code"
  - path: "**/*Test*.*"
    class: non-shipping-fixtures-and-golden-assets
    justification: "compiled test classes whose names contain Test; a listing of the tracked main source set (app/src/main) found no file whose name matches Test[A-Za-z]*.kt, so no shipped class is caught by the glob"
