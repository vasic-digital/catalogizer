# coverage/exclusions/catalog-web.yaml - T200. The checked-in exclusion fence of catalog-web (docs/05 7.3, constitution 11.4.224 E): every entry is justified from the closed class set
# (generated-code | vendored-third-party | non-shipping-fixtures-and-golden-assets); a first-party entry needs a tracked item. Written from direct reads of the tree on 2026-10-06;
# the gate is scripts/coverage/check_exclusions.sh, its verdict on this file is recorded in specs/001-full-project-audit-remediation/evidence/coverage_baseline/catalog-web/exclusions-check.json.
schema: coverage-exclusions/1
application: catalog-web
exclusions:
  - path: "src/components/__tests__/__snapshots__/**"
    class: non-shipping-fixtures-and-golden-assets
    justification: "the recorded snapshot file snapshots.test.tsx.snap: golden output read only by tests, never shipped"
  - path: "e2e/fixtures/**"
    class: non-shipping-fixtures-and-golden-assets
    justification: "Playwright fixture files under catalog-web/e2e/fixtures: test inputs, never shipped"
