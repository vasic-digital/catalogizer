- id: android-cold-start
  name: Cold Start Launch
  category: launch
  priority: critical
  platforms:
  - android
  steps:
  - name: Force stop app
    action: adb_shell:am force-stop com.catalogizer.android
    expected: App process terminated
    timeout: 10
  - name: Launch from launcher
    action: adb_shell:am start -n com.catalogizer.android/.MainActivity
    expected: App launches and displays splash screen within 3 seconds
    timeout: 10
  - name: Verify home screen
    action: 'sleep: 3000'
    expected: Home screen is displayed within 5 seconds total
    timeout: 10
