version: '2.0'
name: Test Suite - EXECUTABLE
# Registration policy: REGISTRATION_MODE defaults to "approval" (self-registered users are inactive
# until an admin approves them). The user-flow cases that log in as a freshly registered user
# (api-flow-*) therefore need a stack started with REGISTRATION_MODE=open (the QA compose stack does
# this) or an explicit admin approval step; the registration policy itself is covered against the
# real binary by catalog-api/registration_approval_binary_test.go.
description: Executable test suite - converted from /run/media/milosvasic/DATA4TB/Projects/Catalogizer/challenges/helixqa-banks/catalogizer-api-comprehensive.json
