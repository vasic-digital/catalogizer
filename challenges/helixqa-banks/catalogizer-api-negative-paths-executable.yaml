- id: neg-api-auth-malformed-jwt
  name: Malformed JWT token formats
  category: authentication-edge-cases
  priority: high
  platforms:
  - api
  steps:
  - name: Send completely invalid JWT
    action: '# TODO: Convert to executable - get /api/v1/auth/me with authorization:
