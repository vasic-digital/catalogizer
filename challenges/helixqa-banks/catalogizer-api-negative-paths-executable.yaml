- id: neg-api-auth-register-duplicate-username
  name: Register with already-existing username
  category: authentication-edge-cases
  priority: high
  platforms:
  - api
  steps:
  - name: Register duplicate user
    action: '# TODO: Convert to executable - post /api/v1/auth/register with username:
