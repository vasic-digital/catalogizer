    expected: 401 Unauthorized with token parse error
    timeout: 10
  - name: Send JWT with only two parts
    action: '# TODO: Convert to executable - get /api/v1/auth/me with authorization:
      bearer header.payload (missing signature)'
    expected: 401 Unauthorized
    timeout: 10
  - name: Send empty Bearer token
    action: '# TODO: Convert to executable - get /api/v1/auth/me with authorization:
      bearer (empty string after bearer)'
    expected: 401 Unauthorized
