version: '2.0'
name: Test Suite - EXECUTABLE
description: Executable test suite - converted from /run/media/milosvasic/DATA4TB/Projects/Catalogizer/challenges/helixqa-banks/catalogizer-api-negative-paths.json
test_cases:
- id: neg-api-auth-expired-refresh-token
  name: Refresh with expired refresh token
  category: authentication-edge-cases
  priority: critical
  platforms:
  - api
  steps:
  - name: Login to obtain tokens
    action: '# TODO: Convert to executable - post /api/v1/auth/login with valid credentials
      to get session_token and refresh_token'
    expected: 200 with valid tokens
    timeout: 10
  - name: Wait for or simulate refresh token expiry
    action: '# TODO: Convert to executable - post /api/v1/auth/refresh with a refresh_token
      that has been artificially expired or tampered with an expired exp claim'
    expected: 401 with error message indicating token is expired, no new tokens issued
    timeout: 10
- id: neg-api-auth-revoked-session
  name: Access API with revoked session token
  category: authentication-edge-cases
  priority: critical
  platforms:
  - api
  steps:
  - name: Login and then logout
    action: '# TODO: Convert to executable - post /api/v1/auth/login, then post /api/v1/auth/logout
      with the obtained session_token'
    expected: 200 for both requests
    timeout: 10
  - name: Use revoked token to access protected endpoint
    action: '# TODO: Convert to executable - get /api/v1/auth/me with the authorization
      header set to the now-logged-out session_token'
    expected: 401 Unauthorized, token should be rejected as revoked or invalid
    timeout: 10
- id: neg-api-auth-concurrent-login
  name: Concurrent login from multiple sessions
  category: authentication-edge-cases
  priority: high
  platforms:
  - api
  steps:
  - name: Login from first session
    action: '# TODO: Convert to executable - post /api/v1/auth/login with admin credentials,
      store token as session_a'
    expected: 200 with valid session_token A
    timeout: 10
  - name: Login from second session
    action: '# TODO: Convert to executable - post /api/v1/auth/login with same admin
      credentials, store token as session_b'
    expected: 200 with valid session_token B (different from A)
    timeout: 10
  - name: Verify both sessions are independently valid
    action: '# TODO: Convert to executable - get /api/v1/auth/me with session_a, then
      get /api/v1/auth/me with session_b'
    expected: Both return 200 with the same user data, or if single-session policy,
      first session returns 401
    timeout: 10
- id: neg-api-auth-brute-force-lockout
  name: Brute force login lockout via rate limiting
  category: authentication-edge-cases
  priority: critical
  platforms:
  - api
  steps:
  - name: Send rapid failed login attempts
    action: '# TODO: Convert to executable - post /api/v1/auth/login with wrong password
      6 times in rapid succession (within 1 minute)'
    expected: First 5 return 401, 6th returns 429 Too Many Requests with Retry-After
      header
    timeout: 10
  - name: Verify lockout persists
    action: '# TODO: Convert to executable - post /api/v1/auth/login with correct
      password immediately after lockout'
    expected: 429 Too Many Requests, rate limit still active even with correct credentials
    timeout: 10
- id: neg-api-auth-token-replay
  name: Token replay attack with previously used refresh token
  category: authentication-edge-cases
  priority: critical
  platforms:
  - api
  steps:
  - name: Login and obtain refresh token
    action: '# TODO: Convert to executable - post /api/v1/auth/login, store refresh_token_1'
    expected: 200 with refresh_token_1
    timeout: 10
  - name: Use refresh token to get new tokens
    action: '# TODO: Convert to executable - post /api/v1/auth/refresh with refresh_token_1,
      receive new refresh_token_2'
    expected: 200 with new session_token and refresh_token_2
    timeout: 10
  - name: Replay the old refresh token
    action: '# TODO: Convert to executable - post /api/v1/auth/refresh with refresh_token_1
      (already consumed)'
    expected: 401 Unauthorized, old refresh token is rejected. Ideally, token family
      should be invalidated as a security measure
    timeout: 10
- id: neg-api-auth-session-fixation
  name: Session fixation attempt with forged token
  category: authentication-edge-cases
  priority: critical
  platforms:
  - api
  steps:
  - name: Craft a JWT with valid structure but wrong secret
    action: '# TODO: Convert to executable - create a jwt token with {"sub": "admin",
      "role": "admin"} signed with a different secret key, send as authorization:
      bearer <forged_token> to get /api/v1/auth/me'
    expected: 401 Unauthorized, signature verification must fail
    timeout: 10
- id: neg-api-auth-bearer-case-sensitivity
  name: Authorization header case variations
  category: authentication-edge-cases
  priority: medium
  platforms:
  - api
  steps:
  - name: Login to get valid token
    action: '# TODO: Convert to executable - post /api/v1/auth/login with valid credentials'
    expected: 200 with valid session_token
    timeout: 10
  - name: Use lowercase bearer prefix
    action: '# TODO: Convert to executable - get /api/v1/auth/me with header authorization:
      bearer <token>'
    expected: Either 200 (case-insensitive parsing) or 401 (strict Bearer parsing).
      Response must be consistent, not a 500
    timeout: 10
  - name: Use uppercase BEARER prefix
    action: '# TODO: Convert to executable - get /api/v1/auth/me with header authorization:
      bearer <token>'
    expected: Either 200 (case-insensitive parsing) or 401 (strict Bearer parsing).
      Response must be consistent, not a 500
    timeout: 10
  - name: Use no prefix
    action: '# TODO: Convert to executable - get /api/v1/auth/me with header authorization:
      <token> (no bearer prefix)'
    expected: 401 Unauthorized, must not crash or return 500
    timeout: 10
- id: neg-api-auth-double-logout
  name: Double logout attempt
  category: authentication-edge-cases
  priority: medium
  platforms:
  - api
  steps:
  - name: Login and logout
    action: '# TODO: Convert to executable - post /api/v1/auth/login, then post /api/v1/auth/logout'
    expected: 200 for both
    timeout: 10
  - name: Logout again with same token
    action: '# TODO: Convert to executable - post /api/v1/auth/logout with the same
      token that was already logged out'
    expected: 401 Unauthorized or 200 (idempotent). Must not return 500 or crash
    timeout: 10
- id: neg-api-auth-sql-injection-username
  name: SQL injection in login username field
  category: authentication-edge-cases
  priority: critical
  platforms:
  - api
  steps:
  - name: Login with SQL injection payload in username
    action: '# TODO: Convert to executable - post /api/v1/auth/login with username:
      "admin'' or ''1''=''1'' --" and password: "anything"'
    expected: 401 Unauthorized, SQL injection must be neutralized by parameterized
      queries, no database error leaked
    timeout: 10
  - name: Login with UNION-based injection
    action: '# TODO: Convert to executable - post /api/v1/auth/login with username:
      "'' union select * from users --" and password: "x"'
    expected: 401 Unauthorized, no data exfiltration, no internal error details
    timeout: 10
- id: neg-api-auth-empty-credentials
  name: Login with empty username and password
  category: authentication-edge-cases
  priority: high
  platforms:
  - api
  steps:
  - name: Login with empty strings
    action: '# TODO: Convert to executable - post /api/v1/auth/login with {"username":
