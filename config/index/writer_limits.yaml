# Consumer DATA for the code-index writer host-resource limits (T022). Read by scripts/audit/index_writer_preflight.sh.
# Owner decision 2026-10-07: this host has 30.2 GiB total RAM, so the upstream 32 GiB MemAvailable floor can never be met.
# The floor is lowered to 20 GiB MemAvailable; indexer heap capped at 60 percent of MemTotal (rule 12.6); single-writer guard
# stays; run only while no other agents or builds run.
# NOTE: the upstream writer (constitution/scripts/codegraph/codegraph_safe.sh, resolve_mem_floor) defaults to a 32 GiB MemAvailable
# floor and reads THIS file via the convention path <project>/config/index/writer_limits.yaml (or CG_SAFE_LIMITS_FILE): key
# min_mem_avail_gib (integer, 16..9999) lowers the floor, and heap_mb stays <= MemAvailable/2. The env var CG_SAFE_MIN_MEM_AVAIL_KB
# may only RAISE it. The consumer preflight scripts/audit/index_writer_preflight.sh reads the same file. This applies once the
# constitution pointer includes the resolve_mem_floor change (earlier pointers hard-code 32 GiB and ignore this file). Upstream request
# record: specs/001-full-project-audit-remediation/evidence/wp02/floor-0107-report.txt
min_mem_avail_gib: 20
heap_cap_percent_of_total: 60
heap_floor_mib: 8192
single_writer: true
