# OpenTelemetry Collector Configuration
# Receives traces, metrics, logs and exports to backends

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: 'catalogizer-api'
          static_configs:
            - targets: ['catalogizer-api:8080']
          metrics_path: /metrics
          # /metrics requires the dedicated scrape credential (METRICS_SCRAPE_TOKEN).
          authorization:
            type: Bearer
            credentials: ${env:METRICS_SCRAPE_TOKEN}
          scrape_interval: 15s

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  resource:
    attributes:
      - key: service.name
        value: catalogizer-api
        action: upsert
      - key: service.version
        value: 2.2.0
        action: upsert
      - key: deployment.environment
        value: production
        action: upsert

exporters:
  # Metrics go to Prometheus' remote-write receiver (Prometheus is started with
  # --web.enable-remote-write-receiver in docker-compose.yml).
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true

  # Traces and logs have no backend in this compose file (the former jaeger and loki
  # exporters are not valid in current collector releases); they are logged only.
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  pprof:
    endpoint: 0.0.0.0:1777

  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]

  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [debug]

    metrics:
      receivers: [otlp, prometheus]
      processors: [batch, resource]
      exporters: [prometheusremotewrite, debug]

    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [debug]
