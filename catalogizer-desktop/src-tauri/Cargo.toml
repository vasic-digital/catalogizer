[package]
name = "catalogizer-desktop"
version = "2.4.0"
description = "Catalogizer Desktop Client"
authors = ["Catalogizer Team"]
license = "MIT"
repository = "https://github.com/catalogizer/catalogizer"
default-run = "catalogizer-desktop"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["full"] }
url = "2"
reqwest = { version = "0.11", features = ["json"] }
directories = "5.0"
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"

# VLC Media Player integration
libvlc-sys = { version = "0.2", optional = true }

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.2"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
vlc-player = ["libvlc-sys"]
