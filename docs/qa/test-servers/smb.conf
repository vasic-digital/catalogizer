[global]
   workgroup = WORKGROUP
   server role = standalone server
   map to guest = never
   smb ports = 1445
   disable netbios = yes
   server min protocol = SMB2
   log file = /dev/stdout
   logging = file
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   pid directory = /tmp
   lock directory = /tmp
   state directory = /tmp
   cache directory = /tmp
   private dir = /tmp/private
   passdb backend = tdbsam:/tmp/private/passdb.tdb
[corpus]
   path = /srv/corpus
   read only = no
   valid users = catsvc
   force user = root
   force group = root
   create mask = 0644
   directory mask = 0755
