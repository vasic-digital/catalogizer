# Go backend. Paths are relative to the repo root, which scan.sh mounts read-only at /usr/src.
sonar.projectKey=catalogizer-api
sonar.projectName=Catalogizer API (Go)
sonar.sources=catalog-api
sonar.exclusions=**/vendor/**,**/*_test.go,**/node_modules/**,**/testdata/**,**/*.pb.go
sonar.tests=catalog-api
sonar.test.inclusions=**/*_test.go
sonar.sourceEncoding=UTF-8
