version: "1.0"
name: "Catalogizer QA stack 3 - HelixQA smoke (API, live HTTP)"
description: "http: steps driven by `helixqa http` against the LIVE stack 3 API. No mocks: every verdict is the real response. Vision-gated UI cases are NOT in this bank; run.sh reports them as SKIP-with-reason unless a validated vision provider is configured (constitution 11.4.278 / 11.4.289)."
test_cases:
  - id: S3-SMOKE-001
    name: "Health endpoint is public and reports healthy"
    category: functional
    priority: critical
    platforms: [api]
    steps:
      - name: "GET /health"
        action: "http: GET /health"
        expected: "200 OK"
        expect_status: 200
    tags: [smoke, health]
  - id: S3-SMOKE-002
    name: "Protected endpoint rejects an unauthenticated request"
    category: security
    priority: critical
    platforms: [api]
    steps:
      - name: "GET /api/v1/media/stats without token"
        action: "http: GET /api/v1/media/stats"
        expected: "401"
        expect_status: 401
    tags: [smoke, auth]
  - id: S3-SMOKE-003
    name: "Admin login succeeds and authenticated stats are served"
    category: functional
    priority: critical
    platforms: [api]
    steps:
      - name: "GET /api/v1/media/stats as admin"
        action: "http: GET /api/v1/media/stats"
        expected: "200 OK"
        auth: admin
        expect_status: 200
    tags: [smoke, auth]
