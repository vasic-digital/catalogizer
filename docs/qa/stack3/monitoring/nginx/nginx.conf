# Production-style reverse proxy for QA stack 3 (plain HTTP: no certificate is provisioned on this QA host).
# :8088 -> web SPA (/) , API (/api/, /ws, /health, /health/deep), :8089 -> marketing website.
# Compression: gzip only - stock nginx has no brotli module (ngx_brotli not in the official image); recorded as a limit in README.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types; default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout; error_log /dev/stderr warn;
  client_max_body_size 64m; sendfile on; keepalive_timeout 30;
  gzip on; gzip_comp_level 5; gzip_min_length 512; gzip_vary on; gzip_proxied any;
  gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml image/svg+xml;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  limit_req_zone $binary_remote_addr zone=perip:10m rate=50r/s;
  upstream qa_api     { server __MON_HOST__:__API_PORT__; keepalive 16; }
  upstream qa_web     { server __MON_HOST__:__WEB_PORT__; keepalive 16; }
  upstream qa_website { server __MON_HOST__:__WEBSITE_PORT__; keepalive 16; }

  # Security headers (shared). Plain HTTP QA stack -> no HSTS (would be meaningless over http and sticky in browsers).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  server {
    listen 8088;
    server_name _;
    limit_req zone=perip burst=100 nodelay;
    proxy_http_version 1.1; proxy_set_header Connection "";
    proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme;
    location = /edge-health { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /ws {
      proxy_pass http://qa_api;
      proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
      # SEC-WS-1R3-1: a location that sets any proxy_set_header does not inherit the server-level ones
      proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }
    location /api/ { proxy_pass http://qa_api; proxy_read_timeout 300s; }
    location = /health { proxy_pass http://qa_api; }
    location = /health/deep { proxy_pass http://qa_api; }
    location / { proxy_pass http://qa_web; }
  }
  server {
    listen 8089;
    server_name _;
    limit_req zone=perip burst=100 nodelay;
    proxy_http_version 1.1; proxy_set_header Connection "";
    proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    location / { proxy_pass http://qa_website; }
  }
}
