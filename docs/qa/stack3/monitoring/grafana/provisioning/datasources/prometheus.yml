apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus-qa
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    basicAuth: true
    basicAuthUser: ${PROM_AUTH_USER}
    secureJsonData:
      basicAuthPassword: $__file{/run/secrets/prom_pw}
    isDefault: true
    editable: false
