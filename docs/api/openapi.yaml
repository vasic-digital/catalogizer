  /api/v1/search/files:
    get:
      tags: [search]
      summary: Search files with advanced filters
      description: |
        Performs advanced file search with filters, sorting, and pagination.
        Searches across all storage roots with support for name, path, extension,
        file type, MIME type, size range, and date range filters.
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          description: Search query (searches in filename and path)
          schema:
            type: string
        - name: path
          in: query
          description: Path filter (partial match)
          schema:
            type: string
        - name: name
          in: query
          description: Name filter (partial match)
          schema:
            type: string
        - name: extension
          in: query
          description: File extension filter (exact match)
          schema:
            type: string
        - name: file_type
          in: query
          description: File type filter (exact match)
          schema:
            type: string
        - name: mime_type
          in: query
          description: MIME type filter (exact match)
          schema:
            type: string
        - name: smb_roots
          in: query
          description: Storage roots filter (comma-separated list)
          schema:
            type: string
        - name: min_size
          in: query
          description: Minimum file size in bytes
          schema:
            type: integer
            format: int64
        - name: max_size
          in: query
          description: Maximum file size in bytes
          schema:
            type: integer
            format: int64
        - name: modified_after
          in: query
          description: Modified after date (RFC3339 format)
          schema:
            type: string
            format: date-time
        - name: modified_before
          in: query
          description: Modified before date (RFC3339 format)
          schema:
            type: string
            format: date-time
        - name: include_deleted
          in: query
          description: Include deleted files
          schema:
            type: boolean
            default: false
        - name: only_duplicates
          in: query
          description: Only show duplicate files
          schema:
            type: boolean
            default: false
        - name: exclude_duplicates
          in: query
          description: Exclude duplicate files
          schema:
            type: boolean
            default: false
        - name: include_directories
          in: query
          description: Include directories in results
          schema:
            type: boolean
            default: true
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Items per page (max 1000)
          schema:
            type: integer
            default: 100
        - name: sort_by
          in: query
          description: Sort field
          schema:
            type: string
            default: name
            enum: [name, size, modified_at, created_at, path, extension]
        - name: sort_order
          in: query
          description: Sort order
          schema:
            type: string
            default: asc
            enum: [asc, desc]
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SearchResult'
        '400':
          description: Invalid filter parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

