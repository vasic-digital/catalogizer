paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      description: Returns service health status, version, and build info.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/deep:
    get:
      tags: [health]
      summary: Deep health check
      description: |
        Performs a comprehensive health check of all subsystems (database, Redis,
        storage, metadata providers) with a 100ms per-component timeout. Returns
        per-component status so load balancers can make routing decisions. Always
        responds within 200ms even if subsystems are unresponsive.
      responses:
        '200':
          description: Deep health check results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepHealthResponse'

  /metrics:
    get:
      tags: [health]
      summary: Prometheus metrics
      description: Exposes Prometheus-compatible metrics for monitoring.
      responses:
        '200':
          description: Prometheus metrics in text format
          content:
            text/plain:
              schema:
                type: string

  /ws:
    get:
      tags: [websocket]
      summary: WebSocket connection
      description: |
        Establishes a WebSocket connection for real-time updates.
        Authentication is via query parameter token, not the Authorization header.
        Events include scan progress, asset updates, and entity changes.
      parameters:
        - name: token
          in: query
          schema:
            type: string
          description: JWT token for authentication
      responses:
        '101':
          description: WebSocket connection established

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: User login
      description: Authenticates a user and returns JWT tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: User registration
      description: Registers a new user account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Refresh JWT token
      description: Exchanges a refresh token for a new access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: User logout
      description: Invalidates the current session token.
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Authorization token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Get current user
      description: Returns the authenticated user's profile.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/status:
    get:
      tags: [auth]
      summary: Check auth status
      description: Returns whether the current token is valid. Does not require authentication.
      responses:
        '200':
          description: Auth status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'

  /api/v1/auth/permissions:
    get:
      tags: [auth]
      summary: Get current user permissions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/profile:
    get:
      tags: [auth]
      summary: Get user profile (alias for /me)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/v1/catalog:
    get:
      tags: [catalog]
      summary: List catalog root
      description: Lists the root level of the file catalog (storage roots).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Root catalog listing
          content:
            application/json:
              schema:
                type: object

  /api/v1/catalog/{path}:
    get:
      tags: [catalog]
      summary: List catalog path
      description: Lists files and directories at the specified catalog path.
      security:
        - BearerAuth: []
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Directory listing
          content:
            application/json:
              schema:
                type: object

  /api/v1/catalog-info/{path}:
    get:
      tags: [catalog]
      summary: Get file info
      description: Returns metadata for a specific file at the given path.
      security:
        - BearerAuth: []
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File information
          content:
            application/json:
              schema:
