  # ── Browse endpoints ──────────────────────────────────────────────────

  /api/v1/browse/roots:
    get:
      tags: [browse]
      summary: List storage roots for browsing
      description: Retrieves all configured storage roots available for directory browsing.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Storage roots list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StorageRoot'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/browse/directory/{path}:
    get:
      tags: [browse]
      summary: Browse directory contents
      description: |
        Lists files and directories within a specific path under a storage root.
        The path parameter should include the storage root name as the first segment
        (e.g., /MyNAS/movies). Supports pagination and sorting.
      security:
        - BearerAuth: []
      parameters:
        - name: path
          in: path
          required: true
          description: Directory path including storage root prefix
          schema:
            type: string
        - name: path
          in: query
          description: Sub-directory path within the storage root
          schema:
            type: string
            default: /
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Items per page (max 1000)
          schema:
            type: integer
            default: 100
        - name: sort_by
          in: query
          description: Sort field
          schema:
            type: string
            default: name
            enum: [name, size, modified_at, created_at, path, extension]
        - name: sort_order
          in: query
          description: Sort order
          schema:
            type: string
            default: asc
            enum: [asc, desc]
      responses:
        '200':
          description: Directory contents
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SearchResult'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/browse/file-info/{path}:
    get:
      tags: [browse]
      summary: Get file information
      description: Returns detailed information about a specific file identified by its path.
      security:
        - BearerAuth: []
      parameters:
        - name: path
          in: path
          required: true
          description: File path (path segment used as file ID)
          schema:
            type: string
      responses:
        '200':
          description: File information
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/FileWithMetadata'
        '400':
          description: Invalid file ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

