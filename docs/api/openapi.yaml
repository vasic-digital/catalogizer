  /api/v1/sync/statistics:
    get:
      tags: [sync]
      summary: Get sync statistics
      description: |
        Returns aggregated sync statistics for the authenticated user over a date range.
        Defaults to the last 30 days. Includes totals, success rates, and breakdowns by status and type.
      security:
        - BearerAuth: []
      parameters:
        - name: start_date
          in: query
          description: Start date (RFC3339 or YYYY-MM-DD format, defaults to 30 days ago)
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          description: End date (RFC3339 or YYYY-MM-DD format, defaults to now)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Sync statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SyncStatistics'
        '401':
          description: Unauthorized
          content:
