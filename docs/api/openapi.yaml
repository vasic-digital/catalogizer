  /api/v1/admin/storage/scan:
    post:
      tags: [admin]
      summary: Trigger storage scan (admin)
      description: |
        Initiates a scan on a specified storage root from the admin panel.
        Accepts a storage_root_id in the request body. Requires admin role.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - storage_root_id
              properties:
                storage_root_id:
                  type: integer
                  format: int64
      responses:
        '501':
          description: Not implemented. This endpoint starts nothing; use POST /api/v1/scans (admin).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  path:
                    type: string
        '400':
          description: Invalid storage root
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin role required)
        '503':
          description: The caller's admin status could not be determined (fail closed)

  /api/v1/admin/backups:
    get:
      tags: [admin]
      summary: List database backups
      description: |
        Lists all available database backup files with their sizes and
        creation timestamps. Requires admin role.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Backup list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BackupInfo'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin role required)
        '503':
          description: The caller's admin status could not be determined (fail closed)
    post:
      tags: [admin]
      summary: Create database backup
      description: |
        Creates a new SQLite database backup using VACUUM INTO for a
        consistent snapshot. The backup is stored in the configured backup
        directory. Requires admin role.
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Backup created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupInfo'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin role required)
        '500':
          description: Backup failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The caller's admin status could not be determined (fail closed)

  /api/v1/admin/backups/{id}/restore:
    post:
      tags: [admin]
      summary: Restore database from backup
      description: |
        Restores the database from a specified backup file. This operation
        replaces the current database and requires a service restart.
        Requires admin role.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '501':
          description: Not implemented. Nothing is restored or queued; restore a backup by replacing the database file while the service is stopped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin role required)
        '404':
          description: Backup not found
        '500':
          description: Restore failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The caller's admin status could not be determined (fail closed)

  /api/v1/users:
    post:
      tags: [users]
      summary: Create user
      description: "Needs `user.create`; a caller without `system.admin` may not assign a role that carries `system.admin` (403). The password is stored with the same versioned hash the login verifies, so the created user can log in immediately (fixed; rows created earlier by the old SHA-256 code are accepted once and upgraded at that login)."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
        '400':
          description: Validation error
        '403':
          description: Missing user.create, or assigning an admin role / a role stronger than the caller's own permissions without system.admin
        '409':
          description: Username/email conflict
    get:
      tags: [users]
      summary: List users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Users list

  /api/v1/users/{id}:
    get:
      tags: [users]
      summary: Get user
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      description: "Returns one user (password hash and salt removed). Reading your own account needs no permission; reading another account needs `user.view`."
      responses:
        '200':
          description: "User (JSON) with its role."
        '400':
          description: "Non-integer id (`Invalid user ID`)."
        '401':
          description: "Unauthenticated (JWT middleware) or the session token is not valid."
        '403':
          description: "Another user's id without `user.view` (`Insufficient permissions`)."
        '404':
          description: "No such user."
        '500':
          description: "Repository or permission-check error."
    put:
      tags: [users]
      summary: Update user
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      description: "Updates profile fields (username, email, first/last/display name, avatar_url, time_zone, language, settings). Self-update: allowed without any permission and returns 200, but `role_id` and `is_active` in the body are silently ignored, also for an administrator updating their own account (measured on the real binary). Updating another user needs `user.update`; `is_active` is applied only when the caller also has `user.manage`. `role_id` is validated and permission-checked (it needs `user.manage`, and a caller without `system.admin` may not assign a role that carries `system.admin`, nor any role carrying a permission the caller does not itself hold, 403; the standard user role (id 2) stays assignable by any user manager; the same rule applies to `role_id` on POST /users) and is saved and echoed in the 200 response, and a later GET shows it (pinned by catalog-api/openapi_contract_binary_test.go). A change of `role_id` or `is_active` revokes all of the target user's sessions, so the old access token stops working at once and the user must log in again. Only a caller with `system.admin` may act on an account whose role carries `system.admin`; for any other caller such a target answers 403 (also when the target's role cannot be resolved)."
      responses:
        '200':
          description: "Updated user (JSON)."
        '400':
          description: "Non-integer id, invalid JSON body, or `role_id` <= 0."
        '401':
          description: "Unauthenticated (JWT middleware) or the session token is not valid."
        '403':
          description: "Another user without `user.update`, an admin target for a non-admin caller, or assigning an admin role (or a role stronger than the caller's own permissions) without `system.admin`."
        '404':
          description: "No such user."
        '409':
          description: "Username or email already exists, or the target's role or activation changed while the request was being processed (the save is a compare-and-set on the values the authorization decision used; reload and retry)."
        '500':
          description: "Repository or permission-check error."
    delete:
      tags: [users]
      summary: Delete user
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      description: "Deletes a user. Needs `user.delete` (checked first, also for your own id). Only a caller with `system.admin` may act on an account whose role carries `system.admin`; for any other caller such a target answers 403 (also when the target's role cannot be resolved). Deleting your own account is refused with 400."
      responses:
        '204':
          description: "User deleted (no body)."
        '400':
          description: "Non-integer id, or the id is the caller's own (`Cannot delete your own account`)."
        '401':
          description: "Unauthenticated (JWT middleware) or the session token is not valid."
        '403':
          description: "Caller lacks `user.delete`, or an admin target for a non-admin caller."
        '404':
          description: "No such user, reported to a caller without `system.admin` (the admin-target check looks the user up). For a `system.admin` caller the operation runs without that lookup; its outcome for an unknown id is not measured."
        '500':
          description: "Repository or permission-check error."
