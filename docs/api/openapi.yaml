          description: Items per page (max 1000)
          schema:
            type: integer
            default: 100
        - name: sort_by
          in: query
          description: Sort field
          schema:
            type: string
            default: name
            enum: [name, size, modified_at, created_at, path, extension]
        - name: sort_order
          in: query
          description: Sort order
          schema:
            type: string
            default: asc
            enum: [asc, desc]
      responses:
        '200':
          description: Directory contents
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
