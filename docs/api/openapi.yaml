      description: "Sets a new password from the JSON body `{\"new_password\": \"...\"}` (validated by the password policy). Needs `user.manage`. Only a caller with `system.admin` may act on an account whose role carries `system.admin`; for any other caller such a target answers 403 (also when the target's role cannot be resolved)."
