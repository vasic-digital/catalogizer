          description: "Log analysis (JSON)."
        '400':
          description: "Non-integer id."
        '401':
          description: "Unauthenticated (JWT middleware), or no integer user_id in the request context."
        '403':
          description: "Caller lacks `system.admin`."
        '500':
          description: "Service error while analysing."
  /api/v1/logs/share:
    post:
      tags: [logs]
      summary: Create log share
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: "Share created; body carries `id` and `share_token`. Measured on the real binary: 200, not 201."

  /api/v1/logs/share/{token}:
    get:
      tags: [logs]
      summary: Get shared log
      security:
        - BearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      description: "Returns a shared log collection by its share token. No permission check beyond the JWT middleware; the share itself must carry the `read` permission. Path parameters reach the handler since the WrapHTTPHandler fix (gin path params are copied into mux.Vars, handlers/gin_adapter.go); verified on the real binary by catalog-api/openapi_contract_binary_test.go."
      responses:
        '200':
          description: "`{\"collection\": {...}, ...}` for the shared collection."
        '403':
          description: "The share does not carry the `read` permission (`Access denied`)."
        '404':
          description: "Unknown, expired or revoked token, or the shared collection cannot be loaded (the body carries the service error text)."
        '401':
          description: "Unauthenticated (JWT middleware)."
    delete:
      tags: [logs]
      summary: Revoke log share
      description: |
        Revokes a log share. Requires `system.admin`. The route shares its path segment with the GET above
        (the router registers GET :token and DELETE :id on the same segment), so the
        segment is the share id here (an integer). Path parameters reach the handler since the WrapHTTPHandler fix (gin path params are copied into mux.Vars, handlers/gin_adapter.go); verified on the real binary by catalog-api/openapi_contract_binary_test.go.
      security:
        - BearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          description: Share id (DELETE) or share token (GET)
          schema:
            type: string
      responses:
        '204':
          description: "Share revoked (no body)."
        '400':
          description: "Non-integer id."
        '401':
          description: "Unauthenticated (JWT middleware), or no integer user_id in the request context."
        '403':
          description: "Caller lacks `system.admin`."
        '500':
          description: "Service error. An unknown share id is reported here too (measured: `500` with `failed to get log share ... no rows`), not as 404."
