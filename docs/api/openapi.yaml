  /api/v1/storage/list/{path}:
    get:
      tags: [storage]
      summary: List storage path
      description: |
        Lists a directory of a configured storage root. Admin only. Local roots
        are confined to the directories named in CATALOGIZER_LOCAL_ROOT_BASES
        (default: none) and symlinks are resolved before the check. At most 1000
        entries are returned; `truncated` is true when more exist.
      security:
        - BearerAuth: []
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
        - name: storage_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Storage path listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                  storage_id:
                    type: integer
                    format: int64
                  truncated:
                    type: boolean
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        path:
                          type: string
                        size:
                          type: integer
                          format: int64
                        is_dir:
                          type: boolean
                        modified_at:
                          type: string
                          format: date-time
        '400':
          description: Missing or invalid storage_id
        '401':
          description: Unauthorized
        '403':
          description: Admin role required
        '404':
          description: Storage root not found, or the directory does not exist
        '409':
          description: Storage root is disabled
        '422':
          description: Root configuration cannot be used to connect, or the local path is outside the allowed bases (CATALOGIZER_LOCAL_ROOT_BASES)
        '502':
          description: The storage backend could not be reached

  /api/v1/storage/roots:
    get:
