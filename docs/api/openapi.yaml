                      $ref: '#/components/schemas/MediaEntity'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  query:
                    type: string
        '400':
          description: Invalid media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
