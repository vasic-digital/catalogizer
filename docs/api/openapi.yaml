  /api/v1/admin/image-quality/revalidate:
    post:
      tags:
      - admin
      summary: Revalidate stale image-quality records
      description: Samples image-quality rows whose last check is older than the cutoff and touches their last-checked time so the validator re-evaluates them. An empty or malformed body uses the defaults. Rate limited to 6 requests per minute.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stale_age_seconds:
                  type: integer
                  default: 604800
                  description: Rows older than this many seconds are sampled (default 7 days)
                limit:
                  type: integer
                  minimum: 1
                  maximum: 4096
                  default: 256
      responses:
        '200':
          description: Sweep summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  sampled:
                    type: integer
                  touched:
                    type: integer
                  stale_age_seconds:
                    type: integer
                  limit:
                    type: integer
        '401':
