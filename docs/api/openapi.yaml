        (e.g., /MyNAS/movies). Supports pagination and sorting.
      security:
        - BearerAuth: []
      parameters:
        - name: path
          in: path
          required: true
          description: Directory path including storage root prefix
          schema:
            type: string
        - name: path
          in: query
          description: Sub-directory path within the storage root
          schema:
