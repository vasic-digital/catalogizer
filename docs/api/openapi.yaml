  /api/v1/auth/change-password:
    post:
      tags: [auth]
      summary: Change user password
      description: |
        Changes the authenticated user's password. Requires the current
        password for verification (bcrypt with per-user salt). The new
        password must be at least 8 characters. A new random salt is
        generated for the updated password hash.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: Password changed successfully
        '400':
          description: Invalid request body or new password too short
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized or current password incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
