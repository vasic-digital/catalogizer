      description: Public. Returns a generated SVG placeholder for the media type.
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
        description: Media type, for example movie
      responses:
        '200':
          description: SVG placeholder
          content:
            image/svg+xml:
              schema:
                type: string
  /api/v1/cover/url/{id}:
    get:
      tags:
      - assets
      summary: Get the cover URL of a media item
      description: Public. Returns the resolved cover URL for a media item.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: type
        in: query
        schema:
          type: string
          default: movie
        description: Media type
      responses:
        '200':
          description: Cover URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  media_item_id:
                    type: integer
                    format: int64
                  cover_url:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/cover/{id}:
    get:
      tags:
      - assets
      summary: Serve the cover image of a media item
      description: 'Public. Serves the stored cover (local file, or a 302 redirect to the cover URL). Falls back to an SVG placeholder and sets X-Cover-Quality: placeholder_fallback when no cover exists. The X-Cover-Quality and X-Cover-Source headers describe the stored image.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Cover image or SVG placeholder
          content:
            image/*:
              schema:
                type: string
                format: binary
        '302':
          description: Redirect to the external cover URL
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/image-proxy:
    get:
      tags:
      - assets
      summary: Proxy an external image
      description: Public. Fetches an image from an allowed CDN (image.tmdb.org, img.omdbapi.com, images.igdb.com) and streams it with a 24 hour cache header. When the upstream is unreachable or not 200, returns a type-specific SVG placeholder instead.
      parameters:
      - name: url
        in: query
        schema:
          type: string
        required: true
        description: Image URL on an allowed domain
      - name: type
        in: query
        schema:
          type: string
          default: movie
        description: Media type used for the placeholder
      responses:
        '200':
          description: Proxied image or SVG placeholder
          content:
            image/*:
              schema:
                type: string
                format: binary
        '400':
          description: url parameter missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Domain not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/stream/{id}:
    get:
      tags:
      - download
      summary: Stream a file
      description: Streams a file by ID. Protocols with random access (SMB, local) support HTTP Range requests (206 Partial Content).
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: download
        in: query
        schema:
          type: boolean
        description: true sets Content-Disposition to attachment
      - name: Range
        in: header
        schema:
          type: string
        description: Byte range, for example bytes=0-1023
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content (Range request)
        '400':
          description: Invalid file ID or the ID is a directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: File not found or not accessible on storage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
