openapi: 3.0.3
info:
  title: Catalogizer API
  description: |
    REST API for the Catalogizer multi-platform media collection manager.
    Detects, categorizes, and organizes media across SMB, FTP, NFS, WebDAV,
    and local filesystems. Provides structured media entity browsing,
    duplicate detection, collection management, and real-time scan monitoring.

    Not described as operations: the Go pprof profiling endpoints under
    `/debug/pprof/` (index, cmdline, profile, symbol, trace, allocs, block,
    goroutine, heap, mutex, threadcreate). They are served only when the server
    runs with `HELIX_PPROF_ENABLED=true` and are meant for operators, not API
    clients.
  version: 2.3.0
  contact:
    name: Catalogizer Support
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:8080
    description: Development server (HTTP)
  - url: https://localhost:8443
    description: Development server (HTTPS/HTTP2/HTTP3)

tags:
  - name: health
    description: Health and metrics endpoints
  - name: auth
    description: Authentication and session management
  - name: catalog
    description: Catalog browsing and file info
  - name: search
    description: File search and duplicate detection
  - name: download
    description: File and directory download
  - name: copy
    description: File copy and upload operations
  - name: media
    description: Media browsing and stats
  - name: entities
    description: Structured media entity browsing
  - name: collections
    description: Media collection management
  - name: assets
    description: Asset management (cover art, thumbnails)
  - name: storage
    description: Storage roots and scanning
  - name: scans
    description: Scan job management
  - name: stats
    description: Catalog statistics and analytics
  - name: smb
    description: SMB network share discovery
  - name: recommendations
    description: Media recommendations
  - name: subtitles
    description: Subtitle management
  - name: conversion
    description: Media format conversion
  - name: users
    description: User management
  - name: roles
    description: Role and permission management
  - name: configuration
    description: System configuration and setup wizard
  - name: errors
    description: Error and crash reporting
  - name: logs
    description: Log collection and management
  - name: challenges
    description: Challenge-based testing framework
  - name: websocket
    description: WebSocket real-time updates
  - name: browse
    description: Directory browsing and file info
  - name: sync
    description: Remote synchronization endpoints
  - name: discovery
    description: Service discovery
  - name: admin
    description: System administration (requires admin role)
  - name: analytics
    description: Usage analytics and event logging
  - name: playback
    description: Playback sessions and progress
  - name: playlists
    description: User playlists
  - name: favorites
    description: User favorites
  - name: reports
    description: Generated usage and performance reports

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/v1/auth/login

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: "Human-readable message; the default error envelope is only {error: ...}"
        details:
          type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy
        time:
          type: string
          format: date-time
        version:
          type: string
        build_number:
          type: string
        build_date:
          type: string

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
        device_info:
          $ref: '#/components/schemas/DeviceInfo'
        remember_me:
          type: boolean

    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        session_token:
          type: string
        refresh_token:
          type: string
        expires_at:
          type: string
          format: date-time

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
        - first_name
        - last_name
      properties:
        username:
          type: string
          minLength: 3
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        first_name:
          type: string
        last_name:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role_id:
          type: integer
        role:
          $ref: '#/components/schemas/Role'
        first_name:
          type: string
        last_name:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
        is_active:
          type: boolean
        is_locked:
          type: boolean
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
        is_system:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DeviceInfo:
      type: object
      properties:
        device_type:
          type: string
        platform:
          type: string
        platform_version:
          type: string
        app_version:
          type: string
        device_model:
          type: string

    AuthStatusResponse:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          $ref: '#/components/schemas/User'
        permissions:
          type: array
          items:
            type: string
        error:
          type: string

    PermissionsResponse:
      type: object
      properties:
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
        is_admin:
          type: boolean

    DiscoveryResponse:
      type: object
      properties:
        service:
          type: string
          example: catalogizer-api
        name:
          type: string
        version:
          type: string
        build:
          type: string
        build_date:
          type: string
        host:
          type: string
        port:
          type: integer
        protocol:
          type: string
          example: http
        websocket_url:
          type: string
        api_base_url:
          type: string
        capabilities:
          type: array
          items:
            type: string
        database:
          type: string
        instance_id:
          type: string
        uptime_seconds:
          type: integer

    StorageRoot:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        protocol:
          type: string
          enum: [smb, ftp, nfs, webdav, local]
        host:
          type: string
        port:
          type: integer
        path:
          type: string
        username:
          type: string
        domain:
          type: string
        enabled:
          type: boolean
        max_depth:
          type: integer
        url:
          type: string
          description: WebDAV address; any password in its userinfo is returned redacted (xxxxx)
        mount_point:
          type: string
          description: NFS local mount point
        allow_empty:
          type: boolean
          description: the share is expected to be empty; by default a scan that finds nothing FAILS (empty_root)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_scan_at:
          type: string
          format: date-time

    CreateStorageRootRequest:
      type: object
      required:
        - name
        - protocol
      properties:
        name:
          type: string
        protocol:
          type: string
          enum: [smb, ftp, nfs, webdav, local]
        host:
          type: string
        port:
          type: integer
        path:
          type: string
        username:
          type: string
        password:
          type: string
        domain:
          type: string
        url:
          type: string
          description: required for webdav
        mount_point:
          type: string
          description: NFS local mount point
        options:
          type: string
          description: NFS mount options (for other protocols a JSON object with credential_ref, tls_mode, host_key_fingerprint, cert_sha256)
        allow_empty:
          type: boolean
          default: false
          description: the share is expected to be empty; its scan may complete with 0 files
        max_depth:
          type: integer
          default: 10

    QueueScanRequest:
      type: object
      required:
        - storage_root_id
      properties:
        storage_root_id:
          type: integer
          format: int64
        path:
          type: string
        scan_type:
          type: string
          default: full
        max_depth:
          type: integer
          default: 10

    ScanStatus:
      type: object
      properties:
        job_id:
          type: string
        storage_root:
          type: string
        protocol:
          type: string
        status:
          type: string
        start_time:
          type: string
          format: date-time
        elapsed_ms:
          type: integer
          format: int64
        current_path:
          type: string
        files_processed:
          type: integer
        files_found:
          type: integer
        files_updated:
          type: integer
        files_deleted:
          type: integer
        error_count:
          type: integer
        reason:
          type: string
          description: why a scan failed or was cancelled (kind and text, never a credential), or a note on a scan that completed with skipped directories; empty otherwise

    MediaEntity:
      type: object
      properties:
        id:
          type: integer
          format: int64
        media_type_id:
          type: integer
          format: int64
        title:
          type: string
        original_title:
          type: string
        year:
          type: integer
        description:
          type: string
        genre:
          type: array
          items:
            type: string
        director:
          type: string
        rating:
          type: number
          format: float
        runtime:
          type: integer
        language:
          type: string
        parent_id:
          type: integer
          format: int64
        season_number:
          type: integer
        episode_number:
          type: integer
        track_number:
          type: integer
        status:
          type: string
        first_detected:
          type: string
          format: date-time
        last_updated:
          type: string
          format: date-time

    MediaEntityDetail:
      allOf:
        - $ref: '#/components/schemas/MediaEntity'
        - type: object
          properties:
            media_type:
              type: string
            file_count:
              type: integer
              format: int64
            children_count:
              type: integer
              format: int64
            external_metadata:
              type: array
              items:
                $ref: '#/components/schemas/ExternalMetadata'

    ExternalMetadata:
      type: object
      properties:
        id:
          type: integer
          format: int64
        media_item_id:
          type: integer
          format: int64
        provider:
          type: string
        external_id:
          type: string
        title:
          type: string
        description:
          type: string
        poster_url:
          type: string
        rating:
          type: number
          format: float

    MediaType:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        count:
          type: integer
          format: int64

    EntityStats:
      type: object
      properties:
        total_entities:
          type: integer
          format: int64
        by_type:
          type: object
          additionalProperties:
            type: integer
            format: int64

    UpdateUserMetadataRequest:
      type: object
      properties:
        user_rating:
          type: number
          format: float
        watched_status:
          type: string
        favorite:
          type: boolean
        is_favorite:
          type: boolean
        personal_notes:
          type: string
        tags:
          type: array
          items:
            type: string

    MediaCollection:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        collection_type:
          type: string
        description:
          type: string
        total_items:
          type: integer
        external_ids:
          type: object
          additionalProperties:
            type: string
        cover_url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateCollectionRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        collection_type:
          type: string
          default: custom
        description:
          type: string
        is_public:
          type: boolean
        is_smart:
          type: boolean
        external_ids:
          type: object
          additionalProperties:
            type: string
        cover_url:
          type: string

    AssetRequestBody:
      type: object
      required:
        - type
        - entity_type
        - entity_id
      properties:
        type:
          type: string
        source_hint:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string

    AssetMetadata:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        status:
          type: string
        content_type:
          type: string
        size:
          type: integer
          format: int64
        entity_type:
          type: string
        entity_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time

    OverallStats:
      type: object
      properties:
        total_files:
          type: integer
          format: int64
        total_directories:
          type: integer
          format: int64
        total_size:
          type: integer
          format: int64
        total_duplicates:
          type: integer
          format: int64
        duplicate_groups:
          type: integer
          format: int64
        storage_roots_count:
          type: integer
          format: int64
        active_storage_roots:
          type: integer
          format: int64
        last_scan_time:
          type: integer
          format: int64

    ChallengeSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        depends_on:
          type: array
          items:
            type: string

    ChallengeResult:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [passed, failed, stuck, timed_out]
        duration_ms:
          type: integer
          format: int64
        assertions:
          type: array
          items:
            type: object
        error:
          type: string

    PaginatedResponse:
      type: object
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    CreateUserRequest:
      type: object
      required:
        - username
        - email
        - password
        - role_id
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role_id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        display_name:
          type: string

    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        role_id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
        is_active:
          type: boolean

    CreateRoleRequest:
      type: object
      required:
        - name
        - permissions
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        description:
          type: string
        permissions:
          type: array
          items:
            type: string

    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string

    ConversionRequest:
      type: object
      properties:
        source_path:
          type: string
        target_path:
          type: string
        source_format:
          type: string
        target_format:
          type: string
        conversion_type:
          type: string
          enum: [video, audio, document, image]
        quality:
          type: string
        priority:
          type: integer

    ConversionJob:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        source_path:
          type: string
        target_path:
          type: string
        source_format:
          type: string
        target_format:
          type: string
        conversion_type:
          type: string
        quality:
          type: string
        priority:
          type: integer
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        created_at:
          type: string
          format: date-time

    MediaBrowseItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        media_type:
          type: string
        quality:
          type: string
        file_size:
          type: integer
          format: int64
        directory_path:
          type: string
        storage_root_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MediaStatsResponse:
      type: object
      properties:
        total_items:
          type: integer
          format: int64
        by_type:
          type: object
          additionalProperties:
            type: integer
        by_quality:
          type: object
          additionalProperties:
            type: integer
        total_size:
          type: integer
          format: int64
        recent_additions:
          type: integer

    SearchFilter:
      type: object
      description: Search filter criteria for advanced file search
      properties:
        query:
          type: string
          description: Search query (searches in filename and path)
        path:
          type: string
          description: Path filter (partial match)
        name:
          type: string
          description: Name filter (partial match)
        extension:
          type: string
          description: File extension filter (exact match)
        file_type:
          type: string
          description: File type filter (exact match)
        mime_type:
          type: string
          description: MIME type filter (exact match)
        storage_roots:
          type: array
          items:
            type: string
          description: Storage roots filter
        min_size:
          type: integer
          format: int64
          description: Minimum file size in bytes
        max_size:
          type: integer
          format: int64
          description: Maximum file size in bytes
        modified_after:
          type: string
          format: date-time
          description: Modified after date (RFC3339 format)
        modified_before:
          type: string
          format: date-time
          description: Modified before date (RFC3339 format)
        include_deleted:
          type: boolean
          default: false
        only_duplicates:
          type: boolean
          default: false
        exclude_duplicates:
          type: boolean
          default: false
        include_directories:
          type: boolean
          default: true

    FileWithMetadata:
      type: object
      description: A file entry with optional metadata key-value pairs
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        path:
          type: string
        size:
          type: integer
          format: int64
        extension:
          type: string
        file_type:
          type: string
        mime_type:
          type: string
        is_directory:
          type: boolean
        storage_root_name:
          type: string
        created_at:
          type: string
          format: date-time
        modified_at:
          type: string
          format: date-time
        metadata:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              file_id:
                type: integer
                format: int64
              key:
                type: string
              value:
                type: string
              data_type:
                type: string

    SearchResult:
      type: object
      description: Paginated search results
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileWithMetadata'
        total_count:
          type: integer
          format: int64
        page:
          type: integer
        limit:
          type: integer
        total_pages:
          type: integer

    AdvancedSearchRequest:
      type: object
      description: Request body for advanced search
      properties:
        filter:
          $ref: '#/components/schemas/SearchFilter'
        page:
          type: integer
          default: 1
        limit:
          type: integer
          default: 100
        sort_by:
          type: string
          default: name
          enum: [name, size, modified_at, created_at, path, extension]
        sort_order:
          type: string
          default: asc
          enum: [asc, desc]

    DirectoryInfo:
      type: object
      description: Directory information with statistics
      properties:
        path:
          type: string
        name:
          type: string
        storage_root_name:
          type: string
        file_count:
          type: integer
        directory_count:
          type: integer
        total_size:
          type: integer
          format: int64
        duplicate_count:
          type: integer
        modified_at:
          type: string
          format: date-time

    SyncEndpoint:
      type: object
      description: Remote synchronization endpoint configuration
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        type:
          type: string
          description: Sync provider type (webdav, s3, gcs, local)
        url:
          type: string
        username:
          type: string
        sync_direction:
          type: string
          description: Direction of sync (push, pull, bidirectional)
        local_path:
          type: string
        remote_path:
          type: string
        sync_settings:
          type: string
          description: JSON-encoded sync settings
        status:
          type: string
          enum: [active, inactive, error]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_sync_at:
          type: string
          format: date-time

    CreateSyncEndpointRequest:
      type: object
      description: Request body for creating a sync endpoint
      required:
        - name
        - type
        - url
        - sync_direction
        - local_path
        - remote_path
      properties:
        name:
          type: string
        type:
          type: string
        url:
          type: string
        username:
          type: string
        password:
          type: string
        sync_direction:
          type: string
        local_path:
          type: string
        remote_path:
          type: string
        sync_settings:
          type: string

    UpdateSyncEndpointRequest:
      type: object
      description: Request body for updating a sync endpoint
      properties:
        name:
          type: string
        url:
          type: string
        username:
          type: string
        password:
          type: string
        sync_direction:
          type: string
        local_path:
          type: string
        remote_path:
          type: string
        sync_settings:
          type: string
        is_active:
          type: boolean

    SyncSession:
      type: object
      description: A sync operation session record
      properties:
        id:
          type: integer
        endpoint_id:
          type: integer
        user_id:
          type: integer
        status:
          type: string
        sync_type:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        duration:
          type: integer
          format: int64
          description: Duration in nanoseconds
        total_files:
          type: integer
        synced_files:
          type: integer
        failed_files:
          type: integer
        skipped_files:
          type: integer
        error_message:
          type: string

    SyncSchedule:
      type: object
      description: Scheduled sync configuration
      properties:
        id:
          type: integer
        endpoint_id:
          type: integer
        user_id:
          type: integer
        frequency:
          type: string
        last_run:
          type: string
          format: date-time
        next_run:
          type: string
          format: date-time
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    SyncStatistics:
      type: object
      description: Aggregated sync statistics over a time period
      properties:
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        total_sessions:
          type: integer
        total_files_synced:
          type: integer
        total_files_failed:
          type: integer
        by_status:
          type: object
          additionalProperties:
            type: integer
        by_type:
          type: object
          additionalProperties:
            type: integer
        average_duration:
          type: integer
          format: int64
          description: Average duration in nanoseconds
        success_rate:
          type: number
          format: float

    ScheduleSyncRequest:
      type: object
      description: Request body for scheduling a sync
      required:
        - endpoint_id
        - frequency
      properties:
        endpoint_id:
          type: integer
        frequency:
          type: string

    CleanupSessionsRequest:
      type: object
      description: Request body for cleaning up old sync sessions
      properties:
        older_than_days:
          type: integer
          default: 30

    SystemInfo:
      type: object
      description: |
        Runtime information for the admin dashboard. A figure the host cannot
        measure is JSON null and its name is listed in `unavailable`; it is never
        a fabricated 0.
      required: [version, uptime, memoryUsage, activeConnections, unavailable]
      properties:
        version:
          type: string
        uptime:
          type: integer
          description: Seconds since the process started
        cpuUsage:
          type: number
          nullable: true
          description: Host CPU busy percentage sampled over ~200 ms from /proc/stat; null when not measurable
        memoryUsage:
          type: number
          description: Go heap in use as a percentage of memory obtained from the OS
        diskUsage:
          type: object
          nullable: true
          description: File system holding the local database; null without a local data directory
          properties:
            total:
              type: integer
              format: int64
            used:
              type: integer
              format: int64
            free:
              type: integer
              format: int64
        activeConnections:
          type: integer
        totalRequests:
          type: integer
          format: int64
          nullable: true
          description: Always null today (no request counter exists)
        unavailable:
          type: array
          items:
            type: string
          description: Names of the figures above that could not be measured

    AdminUserUpdate:
      type: object
      description: Admin-level user update (role, active status, lock status)
      properties:
        role_id:
          type: integer
        is_active:
          type: boolean
        is_locked:
          type: boolean

    StorageOverview:
      type: object
      description: Aggregated storage root statistics
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        protocol:
          type: string
        enabled:
          type: boolean
        file_count:
          type: integer
          format: int64
        total_size:
          type: integer
          format: int64
        last_scan_at:
          type: string
          format: date-time

    ChangePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          description: The user's current password for verification
        new_password:
          type: string
          minLength: 8
          description: The new password (minimum 8 characters)

    AnalyzeMediaRequest:
      type: object
      description: |
        Provide either path or id (at least one is required). If both are
        given, id takes precedence.
      properties:
        path:
          type: string
          description: File path to analyze
        id:
          type: integer
          format: int64
          description: Media item ID to analyze

    AnalyzeMediaResponse:
      type: object
      properties:
        analysis:
          type: object
          properties:
            type:
              type: string
              description: Detected media type name (e.g., movie, tv_show, song, unknown)
            files:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  size:
                    type: integer
                    format: int64
                  mime_type:
                    type: string
            metadata:
              type: object
              description: Media item metadata (present when the file is linked to an entity)
              properties:
                id:
                  type: integer
                  format: int64
                title:
                  type: string
                media_type_id:
                  type: integer
                status:
                  type: string
                first_detected:
                  type: string
                  format: date-time
