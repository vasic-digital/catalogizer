    get:
      tags: [browse]
      summary: Get directories sorted by size
      description: Retrieves directories within a storage root sorted by their total size.
      security:
        - BearerAuth: []
      parameters:
        - name: path
          in: path
          required: true
          description: Storage root name
          schema:
            type: string
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Items per page (max 500)
          schema:
            type: integer
            default: 50
        - name: ascending
          in: query
          description: Sort in ascending order (default descending)
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Directories sorted by size
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
