  /api/v1/conversion/jobs:
    post:
      tags: [conversion]
      summary: Create conversion job
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversionRequest'
      responses:
        '200':
          description: Job queued (status `pending`); the background conversion worker picks it up and moves it to running, then completed or failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversionJob'
        '400':
          description: Invalid request (malformed body, unsupported type/format, or a path outside the conversion roots)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [conversion]
      summary: List conversion jobs
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Conversion jobs list; an empty list is `[]`, never `null`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversionJob'

  /api/v1/conversion/jobs/{id}:
    get:
      tags: [conversion]
      summary: Get conversion job
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Conversion job details
        '403':
          description: The job belongs to another user and the caller has no media.view permission
        '404':
          description: Job not found
    delete:
      tags: [conversion]
      summary: Cancel (delete) a conversion job
      description: |
        Same operation as POST .../cancel (the web client calls DELETE). A pending or running
        job moves to status 'cancelled' and, if running, its converter process group is killed;
        the row is kept. Failed, completed or already cancelled jobs are refused with 409.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Job cancelled (body `{"message": "Job deleted successfully"}`)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: Not the job owner and no manage-users permission
        '409':
          description: Job is not pending or running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/conversion/jobs/{id}/cancel:
    post:
      tags: [conversion]
      summary: Cancel conversion job
      description: |
        A pending or running job moves to 'cancelled'; a running job's converter process group
        is killed and the cancelled state is never overwritten by the finishing worker or
        resurrected at shutdown.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Job cancelled
        '403':
          description: Not the job owner and no manage-users permission
        '404':
          description: Job not found
        '409':
          description: Job is not pending or running

  /api/v1/conversion/jobs/{id}/retry:
    post:
      tags: [conversion]
      summary: Retry a failed conversion job
      description: |
        Resets a failed conversion job back to pending status, clearing the
        error message and resetting timing fields; the background worker then
        runs it again. Only jobs with status 'failed' can be retried.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Job reset to pending (body `{"message": "Job retry started"}`)'
        '403':
          description: Not the job owner and no manage permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Job cannot be retried (status is not `failed`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/conversion/jobs/{id}/download:
    get:
      tags: [conversion]
      summary: Download conversion output
      description: |
        Streams the converted file for download. Only available when the job
        status is 'completed' and the target file exists on disk. Returns
        the file with appropriate Content-Type and Content-Disposition headers.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Converted file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Job not completed or file not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The job belongs to another user (without media.view), or the output lies outside the conversion roots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/conversion/formats:
    get:
      tags: [conversion]
      summary: Get supported formats
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Supported formats

