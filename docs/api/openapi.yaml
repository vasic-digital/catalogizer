        '503':
          description: The caller's admin status could not be determined (fail closed)

  /api/v1/admin/users/{id}:
    put:
      tags: [admin]
      summary: Update user (admin)
      description: |
        Updates a user's role, active status, or lock status. Admin users
        cannot modify their own account to prevent self-lockout. Requires
        admin role: every /api/v1/admin request is checked against the
        caller's CURRENT role in the database (system.admin / `*`), not the
        role_id claim in the access token, so a demotion, a role permission
        change or a deactivation takes effect on the next request.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserUpdate'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Cannot modify own account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin role required)
        '404':
          description: User not found
        '503':
          description: The caller's admin status could not be determined (fail closed)

  /api/v1/admin/storage:
    get:
      tags: [admin]
      summary: Get storage overview
