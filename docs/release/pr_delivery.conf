# Pull-request delivery configuration (constitution 11.4.297). Comments are on their own lines;
# a parser must treat lines starting with '#' as comments and values as the whole text after '='.
# Decision id: OPD-2026-11-17-PR (recorded operator decision, see docs/release/pr_delivery.md).
decision_id=OPD-2026-11-17-PR
mode=pr
base=main
remote=origin
branch_prefix=pr
# never squash, never rebase: every reviewed commit stays on main
landing=merge-commit
# author agent self-reviews and merges; no human merge gate
merger=author-agent
# per repository reviewer list; the operator assigns every PR to this account
reviewers.catalogizer=milos85vasic
# stale-GO window in hours: a PR whose GO is older than this is reported, never parked
merge_window_hours=24
protected_branches=main
# off: no direct-push guard exists yet (reading of branch protection: not protected, HTTP 404)
direct_push_guard=off
shared_single_files=docs/FOLLOW_UPS_NEXT_PHASE.md
tool_written_paths=docs/qa/SHA256SUMS
evidence_dir=docs/qa
