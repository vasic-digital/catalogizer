version: '3.8'

# Security Testing Docker Compose Configuration
# This file contains SonarQube and Snyk services for security scanning

services:
  # SonarQube Community Edition (Enhanced for Freemium)
  sonarqube:
    image: docker.io/library/sonarqube:community@sha256:c0f1160bccfa435db4168c2d7df69af3c3ea7bfeb87395613014048fb33a68c1
    container_name: catalogizer-sonarqube
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar_password
      SONAR_WEB_HOST: 0.0.0.0
      SONAR_WEB_PORT: 9000
      SONAR_WEB_CONTEXT: /
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      # Enhanced security settings
      SONAR_CE_JAVA_OPTS: "-Xmx1g -Xms512m"
      SONAR_WEB_JAVA_OPTS: "-Xmx1g -Xms512m"
      # Freemium configuration
      SONAR_FORCEAUTHENTICATION: "false"
      SONAR_UPDATECENTER_ACTIVATED: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
      - ./sonarqube/conf:/opt/sonarqube/conf:ro
    depends_on:
      - sonarqube-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - security-testing-network
    profiles:
      - sonarqube
      - security-full
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # SonarQube Database
  sonarqube-db:
    image: docker.io/library/postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    container_name: catalogizer-sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar_password
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - security-testing-network
    profiles:
      - sonarqube
      - security-full
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Snyk CLI Container (Enhanced for freemium scanning)
  snyk-cli:
    image: docker.io/library/node:18-alpine@sha256:8d6421d663b4c28fd3ebc498332f249011d118945588d0a35cb9bc4b8ca09d9e
    container_name: catalogizer-snyk-cli
    environment:
      SNYK_TOKEN: ${SNYK_TOKEN:-dummy-token}
      SNYK_CFG_ORG: ${SNYK_ORG:-catalogizer}
      SNYK_SEVERITY_THRESHOLD: ${SNYK_SEVERITY_THRESHOLD:-medium}
      SNYK_INTEGRATION_NAME: "catalogizer-security-scan"
      SNYK_INTEGRATION_VERSION: "1.0.0"
    volumes:
      - .:/project
      - snyk_cache:/root/.npm
      - snyk_global_cache:/root/.cache
    working_dir: /project
    command: >
      sh -c "
        apk add --no-cache curl git jq &&
        npm install -g snyk &&
        echo '🔐 Authenticating with Snyk...' &&
        snyk auth $SNYK_TOKEN || echo '⚠️ Using freemium mode' &&
        echo '📁 Creating reports directory...' &&
        mkdir -p /project/reports &&
        echo '🔍 Running Snyk dependency scan (all projects)...' &&
        snyk test --all-projects --org=$SNYK_ORG --severity-threshold=$SNYK_SEVERITY_THRESHOLD --json --json-file-output=/project/reports/snyk-dependencies-results.json || true &&
        echo '🔍 Running Snyk code analysis (SAST)...' &&
        snyk code test --all-projects --org=$SNYK_ORG --severity-threshold=$SNYK_SEVERITY_THRESHOLD --json --json-file-output=/project/reports/snyk-code-results.json || true &&
        echo '📊 Running Snyk container scan...' &&
        snyk container test catalogizer-api:latest --org=$SNYK_ORG --severity-threshold=$SNYK_SEVERITY_THRESHOLD --json --json-file-output=/project/reports/snyk-container-results.json || true &&
        echo '🔍 Running Snyk IaC scan...' &&
        snyk iac test --org=$SNYK_ORG --severity-threshold=$SNYK_SEVERITY_THRESHOLD --json --json-file-output=/project/reports/snyk-iac-results.json || true &&
        echo '✅ Snyk comprehensive scanning completed'
      "
    profiles:
      - snyk-scan
    networks:
      - security-testing-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # OWASP Dependency Check
  dependency-check:
    image: docker.io/owasp/dependency-check:13.0.0@sha256:0e8f69ad5b00d62000937f4e57189812343f6903d9c83ee712012d51542a020a
    container_name: catalogizer-dependency-check
    environment:
      - JAVA_OPTS=-Xmx2g -Xms1g
    volumes:
      - .:/project:ro
      - dependency_check_data:/usr/share/dependency-check/data
      - ./reports:/reports
    command: [
      "--project", "Catalogizer",
      "--scan", "/project",
      "--format", "HTML",
      "--format", "XML",
      "--format", "JSON",
      "--out", "/reports/dependency-check",
      "--disableRetireJS",
      "--disableNodeJS",
      "--disableYarnAudit",
      "--disableNodeAudit",
      "--suppressionFile", "/project/dependency-check-suppressions.xml"
    ]
    profiles:
      - dependency-check
    networks:
      - security-testing-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Trivy Vulnerability Scanner (Enhanced)
  trivy-scanner:
    image: docker.io/aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    container_name: catalogizer-trivy-scanner
    environment:
      TRIVY_CACHE_DIR: /root/.cache/trivy
      TRIVY_QUIET: "false"
      TRIVY_DEBUG: "false"
      TRIVY_SEVERITY: HIGH,CRITICAL
      TRIVY_FORMAT: json
      TRIVY_OUTPUT: /reports/trivy-results.json
      TRIVY_EXIT_CODE: "0"
    volumes:
      - .:/project:ro
      - trivy_cache:/root/.cache/trivy
      - ./reports:/reports
      - ./.trivy.yaml:/root/.trivy.yaml:ro
      - ./.trivyignore:/project/.trivyignore:ro
      - ./.trivy-secrets.yaml:/project/.trivy-secrets.yaml:ro
    working_dir: /project
    command: >
      sh -c "
        echo '🔍 Running Trivy filesystem scan...' &&
        trivy fs
        --scanners vuln,secret,config
        --severity HIGH,CRITICAL
        --format json
        --output /reports/trivy-results.json
        --skip-dirs 'node_modules,vendor,dist,build,target,releases,.git,sonarqube'
        --skip-files '*.test.js,*.test.ts,*_test.go'
        /project &&
        echo '✅ Trivy scan completed'
      "
    profiles:
      - trivy-scan
      - security-full
    networks:
      - security-testing-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Trivy Server (for CI integration)
  trivy-server:
    image: docker.io/aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    container_name: catalogizer-trivy-server
    ports:
      - "8080:8080"
    volumes:
      - trivy_cache:/root/.cache/trivy
    command: server --listen 0.0.0.0:8080
    profiles:
      - trivy-server
    networks:
      - security-testing-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Semgrep SAST Scanner
  semgrep-scanner:
    image: docker.io/semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    container_name: catalogizer-semgrep
    volumes:
      - .:/project:ro
      - ./reports:/reports
    working_dir: /project
    command: [
      "semgrep", "scan",
      "--config", "auto",
      "--config", "/project/.semgrep.yml",
      "--json",
      "--output", "/reports/semgrep-results.json",
      "--exclude", "node_modules",
      "--exclude", "vendor",
      "--exclude", "dist",
      "--exclude", "build",
      "--exclude", "target",
      "--exclude", "releases",
      "--exclude", ".git",
      "--severity", "WARNING",
      "."
    ]
    profiles:
      - semgrep-scan
      - security-full
    networks:
      - security-testing-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Hadolint Dockerfile Linter
  hadolint:
    image: docker.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
    volumes:
      - .:/src:ro
    working_dir: /src
    entrypoint: ["hadolint"]
    command: ["docker/Dockerfile.builder"]
    profiles:
      - hadolint
      - security-full
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  sonarqube_data:
    driver: local
  sonarqube_logs:
    driver: local
  sonarqube_extensions:
    driver: local
  sonarqube_db_data:
    driver: local
  snyk_cache:
    driver: local
  snyk_global_cache:
    driver: local
  dependency_check_data:
    driver: local
  trivy_cache:
    driver: local

networks:
  security-testing-network:
    driver: bridge
