# disk_headroom.conf - consumer DATA for scripts/containers/disk_headroom.sh (constitution section 12.9).
# min_free_bytes is an ABSOLUTE byte count, never a percentage (measured at plan review: root filesystem 96% used
# with about 85 GB free, so any percentage floor above 4% would refuse every build); a percentage is refused as a
# configuration error. The script only reads the min_free_bytes line; the lines below are the derivation record.
# formula: min_free_bytes = 2 * largest_image_bytes + build_scratch_peak_bytes (factor 2 = stated margin for compressed registry sizes)
# input largest_image_bytes = 6086120270, measured 2026-10-05 with `podman image inspect --format '{{.Size}}'` over all 132 images in local storage (rootless, graphroot ~/.local/share/containers/storage)
# input build_scratch_peak_bytes = 0, NOT MEASURED YET (no build has run; build/containers/profile.json does not exist), measured 2026-10-05: absent
# measured note: PROVISIONAL. None of the four WP-09 base images is in local storage (the local images belong to other projects) and no registry manifest was read (no pull, no network use in T001),
#   so the largest local image is only a stand-in for "the largest image this list uses"; T006 re-derives it once the WP-09 images exist, T115 re-derives it with the measured scratch peak, T010 reviews it.
min_free_bytes=12172240540
