version: '2.0'
name: golden-good
test_cases:
- id: good-login
  name: Login returns a token
  category: authentication
  priority: critical
  platforms: [api]
  requires_env: [QA_USER, QA_PASS]
  steps:
  - name: POST login
    action: "http: POST /api/v1/auth/login"
    auth: none
    body: {username: "${QA_USER}", password: "${QA_PASS}"}
    expect_status: 200
    expect_json_path: "$.session_token"
    expected: 200 with a session token
    timeout: 10
  - name: wrong password refused
    action: "http: POST /api/v1/auth/login"
    auth: none
    body: {username: "${QA_USER}", password: "not-the-password"}
    expect_status: 401
    negative: true
    expected: refusal
    timeout: 10
  metadata:
    v3:
      schema: bank-case/3
      surface: "POST /api/v1/auth/login"
      oracle: {strategy: specified, independent_of_sut: true}
      needs: {service: catalog-api, credential_env: [QA_USER, QA_PASS]}
      flow: deterministic
      evidence: [http_exchange]
- id: good-ui-tap
  name: Tap with an OCR assertion
  category: ui
  priority: high
  platforms: [android]
  steps:
  - name: tap the login button
    action: "tap: 120,340"
    ocr_assert: {region: full, must_contain: [Login], must_not_contain: [Error]}
    expected: login form visible
    timeout: 10
  metadata:
    v3:
      schema: bank-case/3
      surface: login-screen
      oracle: {strategy: invariant, independent_of_sut: true}
      needs: {device: android-emulator}
      flow: deterministic
      evidence: [screenshot, ocr_text]
