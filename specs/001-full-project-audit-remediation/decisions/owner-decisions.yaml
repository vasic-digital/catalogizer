    a build step is `blocked-unavailable`, never run locally and never a pass; the host identity stays
    an input. Revision 16 (tasks.md rev 14): the answered part settles where builds run, so the block
    is the host identity alone and sits where tasks.md places `BLOCKED-ON ODG-07`: the P0 build-host bootstrap
