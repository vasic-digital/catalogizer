version: '3.8'

services:
  # PostgreSQL Database - matching production setup
  postgres:
    image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    container_name: catalogizer-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalogizer
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: catalogizer_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "25432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogizer"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - catalogizer-network

  # Redis Cache - matching production setup
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: catalogizer-redis-dev
    restart: unless-stopped
    ports:
      - "26379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - catalogizer-network

  # Catalogizer API
  api:
    build:
      context: .
      dockerfile: catalog-api/Dockerfile.dev
    container_name: catalogizer-api-dev
    restart: unless-stopped
    env_file: .env
    environment:
      # Database configuration
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: catalogizer
      DATABASE_PASSWORD: "${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}"
      DATABASE_NAME: catalogizer_dev

      # Redis configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # S3/MinIO configuration
      STORAGE_TYPE: s3
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin123
      STORAGE_BUCKET: catalogizer-covers
      STORAGE_USE_SSL: "false"
      STORAGE_REGION: us-east-1

      # Application configuration
      APP_ENV: development
      API_PORT: 28080
      LOG_LEVEL: debug

      # CORS for local development
      CORS_ENABLED: "true"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:19006"
    ports:
      - "28080:8080"
    volumes:
      - ./catalog-api:/app
      - ./submodules:/submodules:ro
      - api_cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - catalogizer-network
    command: go run main.go

  # Optional: pgAdmin for database management
  pgadmin:
    image: docker.io/dpage/pgadmin4:9.18.0@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
    container_name: catalogizer-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@catalogizer.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "25050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - catalogizer-network
    profiles:
      - tools

  # Optional: Redis Commander for Redis management
  redis-commander:
    image: docker.io/rediscommander/redis-commander:latest@sha256:19cd0c49f418779fa2822a0496c5e6516d0c792effc39ed20089e6268477e40a
    container_name: catalogizer-redis-commander-dev
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "28081:8081"
    depends_on:
      - redis
    networks:
      - catalogizer-network
    profiles:
      - tools

  # MinIO - S3-compatible local object storage for cover art and media content
  minio:
    image: quay.io/minio/minio:latest
    container_name: catalogizer-minio-dev
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "29000:9000"
      - "29001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - catalogizer-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_cache:
    driver: local
  pgadmin_data:
    driver: local
  minio_data:
    driver: local

networks:
  catalogizer-network:
    driver: bridge
