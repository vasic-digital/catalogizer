# =============================================================================
# Test Infrastructure for Catalogizer Integration Tests (WP-13, T129; docs/16 section 10)
# =============================================================================
#
# Real PostgreSQL, Redis, FTP, SMB and WebDAV servers for the non-unit tests (constitution 11.4.27: no mocks outside unit tests).
# One compose project per run: `catalogizer-test-<build_id>`. Start and stop only through the lifecycle scripts, which generate the
# per-run credentials and random host ports (scripts/test-infra/gen_env.sh), seed the deterministic corpus and take the per-project lease:
#
#   scripts/test-infra/up.sh   --build-id <id>        scripts/test-infra/down.sh --build-id <id>
#
# Rules this file follows (docs/16 D-06, D-07):
#   - every image is pinned by its index digest (the digests are the entries IMG-INFRA-* of build/containers/images.lock.yaml);
#   - no credential and no host port is a literal: every one is a ${TI_*} variable from the mode 0600 env file of the run;
#   - every service carries the labels project=catalogizer, op_id / catalogizer.op_id (the registered long operation of the stack) and
#     catalogizer.test_project=<project>; teardown removes exactly the resources that carry this project's label, nothing else;
#   - rootless: no privileged mode, no kernel mount, no device; host ports are random, never below 1024. The one added capability is
#     AUDIT_WRITE on the ftp service: pure-ftpd drops its capability set at start and exits 252 ("Unable to switch capabilities") without it
#     under this host's podman defaults (measured: every capability bisected, AUDIT_WRITE alone suffices). It is a capability of the container's own
#     user namespace; it grants nothing on the host.
# Removed with this rework (decisions recorded in specs/001-full-project-audit-remediation/evidence/wp12):
#   - the `nfs` service (erichough/nfs-server, `privileged: true`, SYS_ADMIN): rootless podman cannot provide a kernel NFS server (DR-16-2,
#     constitution 11.4.161); the unprivileged user-space attempt lives in docker-compose.test-infra.nfs.yml (T134);
#   - the `test-data-seeder` (alpine:3.19, an unpinned shell heredoc): replaced by the deterministic scripts/test-infra/seed_corpus.sh;
#   - MinIO is kept only as the profile `minio-blocked`: the image `quay.io/minio/minio` is not obtainable from any registry probed
#     (evidence/wp12/minio-blocked.txt), so no digest can be pinned and the service cannot start. It is BLOCKED, not passing.
# =============================================================================

x-labels: &labels
  project: catalogizer
  op_id: "${TI_OP_ID:?TI_OP_ID is generated by scripts/test-infra/gen_env.sh}"
  catalogizer.op_id: "${TI_OP_ID:?TI_OP_ID is generated by scripts/test-infra/gen_env.sh}"
  catalogizer.test_project: "${TI_PROJECT:?TI_PROJECT is generated by scripts/test-infra/gen_env.sh}"

services:

  # PostgreSQL 15 (IMG-INFRA-POSTGRES). Protocol-level health: a real SELECT 1 (not a TCP check).
  postgres:
    image: docker.io/library/postgres@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    pull_policy: never
    labels: *labels
    environment:
      POSTGRES_DB: "${TI_POSTGRES_DB:?}"
      POSTGRES_USER: "${TI_POSTGRES_USER:?}"
      POSTGRES_PASSWORD: "${TI_POSTGRES_PASSWORD:?}"
    ports:
      - "127.0.0.1:${TI_PORT_POSTGRES:?}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc 'SELECT 1' | grep -qx 1"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks: [test-network]
    mem_limit: 512m
    cpus: 0.5

  # Redis 7 (IMG-INFRA-REDIS), password required. Protocol-level health: an authenticated PING.
  redis:
    image: docker.io/library/redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    pull_policy: never
    labels: *labels
    environment:
      REDIS_PASSWORD: "${TI_REDIS_PASSWORD:?}"
      REDISCLI_AUTH: "${TI_REDIS_PASSWORD:?}"
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${TI_PORT_REDIS:?}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 2s
    networks: [test-network]
    mem_limit: 256m
    cpus: 0.25

  # FTP (IMG-INFRA-FTP, pure-ftpd). The data directory is the seeded corpus copy of this run. Passive range 30000-30009 is reachable on the
  # compose network (the clients run on it); it is not published, because a published passive range cannot use random host ports.
  ftp:
    image: docker.io/stilliard/pure-ftpd@sha256:6435d108eb3fad29730f1b6748c1d49f3fa13e5d0fb49979ec3e0e96c5dbd94a
    pull_policy: never
    labels: *labels
    cap_add:
      - AUDIT_WRITE
    environment:
      FTP_USER_NAME: "${TI_FTP_USER:?}"
      FTP_USER_PASS: "${TI_FTP_PASSWORD:?}"
      FTP_USER_HOME: /home/ftpusers/ftpdata
      FTP_PASSIVE_PORTS: "30000:30009"
      FTP_MAX_CLIENTS: "10"
      FTP_MAX_CONNECTIONS: "5"
    ports:
      - "127.0.0.1:${TI_PORT_FTP:?}:21"
    volumes:
      - "${TI_DATA_DIR:?}/ftp:/home/ftpusers/ftpdata"
    networks: [test-network]
    mem_limit: 256m
    cpus: 0.25

  # SMB (IMG-INFRA-SMB, dperson/samba). One authenticated share `testshare` over the seeded corpus copy of this run.
  smb:
    image: docker.io/dperson/samba@sha256:66088b78a19810dd1457a8f39340e95e663c728083efa5fe7dc0d40b2478e869
    pull_policy: never
    labels: *labels
    environment:
      USER: "${TI_SMB_USER:?};${TI_SMB_PASSWORD:?}"
      SHARE: "testshare;/test-data;yes;no;no;${TI_SMB_USER:?};${TI_SMB_USER:?};${TI_SMB_USER:?};Catalogizer test share"
      GLOBAL: "server min protocol = SMB2"
      PERMISSIONS: "yes"
      NMBD: "no"
    ports:
      - "127.0.0.1:${TI_PORT_SMB:?}:445"
    volumes:
      - "${TI_DATA_DIR:?}/smb:/test-data"
    networks: [test-network]
    mem_limit: 256m
    cpus: 0.25

  # WebDAV (IMG-INFRA-WEBDAV, bytemark/webdav), basic authentication, over the seeded corpus copy of this run.
  webdav:
    image: docker.io/bytemark/webdav@sha256:bcabbc024c511b9c63ed3345f88573e31d84c952ee493c9acb3fe345f4f80f57
    pull_policy: never
    labels: *labels
    environment:
      AUTH_TYPE: Basic
      USERNAME: "${TI_WEBDAV_USER:?}"
      PASSWORD: "${TI_WEBDAV_PASSWORD:?}"
      LOCATION: /
    ports:
      - "127.0.0.1:${TI_PORT_WEBDAV:?}:80"
    volumes:
      - "${TI_DATA_DIR:?}/dav:/var/lib/dav/data"
    networks: [test-network]
    mem_limit: 256m
    cpus: 0.25

  # MinIO: BLOCKED. No registry serves the image (evidence/wp12/minio-blocked.txt), so this service has no digest and is reachable only
  # through the profile below, which requires the owner to name an S3 image; it never starts by default and never counts as a pass.
  minio:
    image: "${TI_MINIO_IMAGE:-localhost/blocked-minio-not-obtainable:none}"   # placeholder that cannot resolve; see the comment above
    profiles: ["minio-blocked"]
    labels: *labels
    environment:
      MINIO_ROOT_USER: "${TI_MINIO_ROOT_USER:?}"
      MINIO_ROOT_PASSWORD: "${TI_MINIO_ROOT_PASSWORD:?}"
    command: ["server", "/data"]
    networks: [test-network]

networks:
  test-network:
    name: "${TI_PROJECT:?}_test-network"
    labels:
      project: catalogizer
      catalogizer.test_project: "${TI_PROJECT:?}"
